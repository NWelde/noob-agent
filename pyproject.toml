[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/src/noob_agent/connectors/minecraft_sidecar/node_modules"]

[tool.hatch.build.targets.wheel]
packages = ["src/noob_agent"]

[project]
name = "noob-agent"
version = "0.1.0"
description = "A bounded harness for evaluating learned agent skills in unfamiliar games."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "vizdoom>=1.3,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.8,<1",
]
integrations = [
  "cwsandbox>=1,<2",
  "openai>=1,<3",
  "weave>=0.52,<1",
]

[project.scripts]
noob-agent = "noob_agent.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
